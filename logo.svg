<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="KATALOGOHUB">
  <title>KATALOGOHUB</title>

  <defs>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="13" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b3"/>
      <feMerge>
        <feMergeNode in="b1"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b3"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softwhite" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="g"/>
      <feComponentTransfer in="g" result="gd">
        <feFuncA type="linear" slope="0.35"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="gd"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="bleed" cx="66%" cy="52%" r="42%">
      <stop offset="0%" stop-color="#35FFC0" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#35FFC0" stop-opacity="0"/>
    </radialGradient>

    <g id="L-K"><path d="M0,0 L22,0 L22,38 L54,0 L82,0 L46,42 L86,100 L58,100 L32,60 L22,72 L22,100 L0,100 Z"/></g>
    <g id="L-A"><path fill-rule="evenodd" d="M0,100 L20,0 L62,0 L82,100 L60,100 L55,80 L27,80 L22,100 Z M32,58 L50,58 L45,22 L37,22 Z"/></g>
    <g id="L-T"><path d="M0,0 L84,0 L84,22 L53,22 L53,100 L31,100 L31,22 L0,22 Z"/></g>
    <g id="L-L"><path d="M0,0 L22,0 L22,78 L66,78 L66,100 L0,100 Z"/></g>
    <g id="L-O"><path fill-rule="evenodd" d="M14,0 L72,0 L86,14 L86,86 L72,100 L14,100 L0,86 L0,14 Z M22,26 L26,22 L60,22 L64,26 L64,74 L60,78 L26,78 L22,74 Z"/></g>
    <g id="L-G"><path fill-rule="evenodd" d="M14,0 L72,0 L86,14 L86,34 L64,34 L64,26 L60,22 L26,22 L22,26 L22,74 L26,78 L60,78 L64,74 L64,60 L46,60 L46,40 L86,40 L86,86 L72,100 L14,100 L0,86 L0,14 Z"/></g>
    <g id="L-H"><path d="M0,0 L22,0 L22,40 L66,40 L66,0 L88,0 L88,100 L66,100 L66,62 L22,62 L22,100 L0,100 Z"/></g>
    <g id="L-U"><path d="M0,0 L22,0 L22,74 L28,80 L58,80 L64,74 L64,0 L86,0 L86,82 L68,100 L18,100 L0,82 Z"/></g>
    <g id="L-B"><path fill-rule="evenodd" d="M0,0 L64,0 L80,16 L80,38 L72,50 L82,62 L82,84 L66,100 L0,100 Z M22,20 L52,20 L58,26 L58,34 L52,40 L22,40 Z M22,60 L56,60 L62,66 L62,74 L56,80 L22,80 Z"/></g>

    <g id="KATALOGO">
      <use href="#L-K" x="0"/><use href="#L-A" x="96"/><use href="#L-T" x="188"/>
      <use href="#L-A" x="282"/><use href="#L-L" x="374"/><use href="#L-O" x="452"/>
      <use href="#L-G" x="550"/><use href="#L-O" x="648"/>
    </g>
    <g id="HUB">
      <use href="#L-H" x="756"/><use href="#L-U" x="856"/><use href="#L-B" x="954"/>
    </g>
  </defs>

  <rect width="1200" height="460" fill="url(#bleed)"/>

  <g transform="translate(60,172) scale(1.04) skewX(-8)">

    <g transform="translate(9,11)" fill="#1A1A1A"><use href="#KATALOGO"/></g>
    <g transform="translate(9,11)" fill="#1A1A1A"><use href="#HUB"/></g>

    <g filter="url(#softwhite)">
      <use href="#KATALOGO" fill="#FFFFFF"/>
      <path d="M4,100 L18,100 L16,124 Q11,133 5,124 Z" fill="#FFFFFF"/>
      <circle cx="10.5" cy="127" r="6.5" fill="#FFFFFF"/>
    </g>

    <g filter="url(#neon)">
      <use href="#HUB" fill="#35FFC0"/>
      <path d="M980,100 L994,100 L992,120 Q987,128 981,120 Z" fill="#35FFC0"/>
      <circle cx="986.5" cy="123" r="6" fill="#35FFC0"/>
    </g>

  </g>
</svg>
