<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalogo Hub — Stories Card 2</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1080px;
      aspect-ratio: 9 / 16;
      background: linear-gradient(180deg, #F59E0B 0%, #D97706 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 40px;
      text-align: center;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0,0,0,0.2) 0%, transparent 50%);
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      width: 100%;
    }

    .icon {
      font-size: 100px;
      animation: spin 3s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 56px;
      font-weight: 900;
      color: #FFFFFF;
      text-transform: uppercase;
      letter-spacing: -1px;
      line-height: 1.1;
      margin: 0;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
    }

    .subtitle {
      font-size: 32px;
      color: #FFFFFF;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
    }

    .countdown {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: 800;
      color: #FFFFFF;
      margin: 20px 0;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.2);
    }

    .countdown span {
      background: rgba(0,0,0,0.2);
      padding: 10px 16px;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.3);
    }

    .features {
      font-size: 18px;
      color: #FFFFFF;
      font-weight: 600;
      margin: 20px 0;
    }

    .feature {
      margin: 8px 0;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.2);
    }

    .cta {
      background: #FFFFFF;
      color: #D97706;
      padding: 16px 40px;
      border-radius: 999px;
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: none;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    .cta:hover {
      transform: scale(1.1);
      box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }

    .link {
      font-size: 14px;
      color: #FFFFFF;
      margin-top: 30px;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.2);
    }

    .link strong {
      font-size: 16px;
      display: block;
      margin-top: 8px;
      font-family: 'Courier New', monospace;
      background: rgba(0,0,0,0.2);
      padding: 8px 16px;
      border-radius: 6px;
      border: 2px solid rgba(255,255,255,0.3);
    }

    @media (max-width: 768px) {
      .container {
        padding: 40px 30px;
      }

      h1 {
        font-size: 48px;
      }

      .subtitle {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <div class="icon">⏰</div>

      <h1>Só 3 Dias</h1>

      <div class="countdown">
        <span>GRÁTIS</span>
        <span>SEM CARTÃO</span>
      </div>

      <div class="features">
        <div class="feature">✅ Catálogo completo</div>
        <div class="feature">✅ Sem limite de camisas</div>
        <div class="feature">✅ Teste tudo</div>
      </div>

      <button class="cta">Começar Agora</button>

      <div class="link">
        katalogohub.com/admin.html
      </div>
    </div>
  </div>
</body>
</html>
