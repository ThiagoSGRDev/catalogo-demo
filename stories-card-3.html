<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalogo Hub — Stories Card 3</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1080px;
      aspect-ratio: 9 / 16;
      background: linear-gradient(135deg, #35FFC0 0%, #00D4FF 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 60px 40px;
      text-align: center;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
    }

    .top {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }

    h1 {
      font-size: 64px;
      font-weight: 900;
      color: #0A0A0A;
      text-transform: uppercase;
      letter-spacing: -2px;
      line-height: 1;
      margin: 0;
      text-shadow: 2px 2px 0px rgba(255,255,255,0.2);
    }

    .tagline {
      font-size: 24px;
      color: #0A0A0A;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .middle {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }

    .bottom {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 20px;
      width: 100%;
    }

    .benefit {
      font-size: 18px;
      color: #0A0A0A;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .link-box {
      background: rgba(0,0,0,0.15);
      color: #0A0A0A;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      font-family: 'Courier New', monospace;
      border: 3px solid rgba(0,0,0,0.3);
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 48px;
      }

      .tagline {
        font-size: 20px;
      }

      .middle {
        font-size: 64px;
      }

      .benefit {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <div class="top">
        <h1>Seu Catálogo</h1>
        <div class="tagline">No Celular ✨</div>
      </div>

      <div class="middle">
        📱
      </div>

      <div class="bottom">
        <div class="benefit">3 DIAS GRÁTIS</div>
        <div class="link-box">katalogohub.com/admin.html</div>
      </div>
    </div>
  </div>
</body>
</html>
