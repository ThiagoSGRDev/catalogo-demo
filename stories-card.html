<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalogo Hub — Stories Card</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .container {
      width: 100%;
      max-width: 1080px;
      aspect-ratio: 9 / 16;
      background: linear-gradient(135deg, #000000 0%, #0a1612 50%, #001a0d 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 40px;
      text-align: center;
    }

    .container::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(53, 255, 192, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 0;
    }

    .container::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      width: 100%;
    }

    .icon {
      font-size: 80px;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    h1 {
      font-size: 62px;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: -2px;
      line-height: 1;
      margin: 0;
      background: linear-gradient(135deg, #35FFC0 0%, #00D4FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 26px;
      color: #94A3B8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 20px 0;
    }

    .features {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      font-size: 18px;
      color: #CBD5E1;
      margin: 20px 0;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
    }

    .feature::before {
      content: '✓';
      color: #35FFC0;
      font-weight: 800;
      font-size: 24px;
    }

    .cta {
      background: linear-gradient(135deg, #35FFC0 0%, #22D3EE 100%);
      color: #000000;
      padding: 18px 40px;
      border-radius: 16px;
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      border: none;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 20px 40px rgba(53, 255, 192, 0.4);
      transition: all 0.3s ease;
    }

    .cta:hover {
      transform: scale(1.05);
      box-shadow: 0 30px 60px rgba(53, 255, 192, 0.6);
    }

    .link {
      font-size: 16px;
      color: #35FFC0;
      font-weight: 700;
      margin-top: 30px;
      letter-spacing: 0.5px;
    }

    .link strong {
      font-size: 20px;
      display: block;
      margin-top: 8px;
      color: #ffffff;
      font-family: 'Courier New', monospace;
      background: rgba(53, 255, 192, 0.1);
      padding: 12px 20px;
      border-radius: 8px;
      border: 2px solid #35FFC0;
    }

    .logo {
      position: absolute;
      top: 30px;
      left: 30px;
      font-size: 18px;
      font-weight: 800;
      color: #35FFC0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    @media (max-width: 768px) {
      .container {
        padding: 40px 30px;
      }

      h1 {
        font-size: 48px;
      }

      .subtitle {
        font-size: 20px;
      }

      .features {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">KH</div>

    <div class="content">
      <div class="icon">📱</div>

      <h1>Teste Grátis</h1>

      <div class="subtitle">3 dias • Sem cartão</div>

      <div class="features">
        <div class="feature">Catálogo no celular</div>
        <div class="feature">Painel fácil</div>
        <div class="feature">Sem taxa por venda</div>
      </div>

      <button class="cta">Entra Aqui</button>

      <div class="link">
        Seu catálogo começa agora
        <strong>katalogohub.com/admin.html</strong>
      </div>
    </div>
  </div>

  <script>
    // Salvar como imagem (para screenshot)
    console.log('💚 Dica: Use print (Ctrl+P) ou screenshot pra salvar como imagem pro Stories');
  </script>
</body>
</html>
