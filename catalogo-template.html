<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark-esportivo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@300;500;600;700&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ==========================================================
     CONFIG DE MARCA — o único bloco visual que muda entre lojistas.
     Nenhuma imagem, logo, produto ou categoria fica fixa aqui —
     tudo isso vem do Supabase do cliente (ver script no fim do arquivo).
     ========================================================== */
  :root{
    --font-display:'Anton', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'Space Mono', monospace;
    --raio-card:14px;
    --raio-botao:10px;
  }

  html[data-theme="dark-esportivo"]{
    --cor-fundo:#0A0D10;
    --cor-fundo-2:#0F1418;
    --cor-texto:#F4F6F7;
    --cor-texto-fraco:rgba(244,246,247,0.55);
    --cor-primaria:#00E5FF;
    --cor-primaria-forte:#7DF9FF;
    --cor-sobre-primaria:#0A0D10;
    --cor-linha:rgba(244,246,247,0.12);
    --cor-card:rgba(255,255,255,0.03);
  }
  html[data-theme="clean-light"]{
    --cor-fundo:#FFFFFF;
    --cor-fundo-2:#F5F6F8;
    --cor-texto:#12161C;
    --cor-texto-fraco:rgba(18,22,28,0.55);
    --cor-primaria:#1D4ED8;
    --cor-primaria-forte:#3B82F6;
    --cor-sobre-primaria:#FFFFFF;
    --cor-linha:rgba(18,22,28,0.12);
    --cor-card:rgba(18,22,28,0.03);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--cor-fundo); color:var(--cor-texto); font-family:var(--font-body);
    -webkit-font-smoothing:antialiased; padding-bottom:96px; transition:background .2s ease, color .2s ease;
  }
  h1,h2,h3{font-family:var(--font-display); letter-spacing:.03em; text-transform:uppercase; font-weight:400;}
  a{color:inherit;}
  .wrap{max-width:560px; margin:0 auto; padding:0 20px;}

  /* TOPBAR */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--cor-fundo); padding:16px 20px; border-bottom:1px solid var(--cor-linha);
    position:sticky; top:0; z-index:30;
  }
  .topbar .logo{font-family:var(--font-display); font-size:16px; letter-spacing:.04em;}
  .icon-btn{position:relative; color:var(--cor-primaria); background:none; border:none; cursor:pointer; padding:4px; display:flex; align-items:center; justify-content:center;}
  .icon-btn svg{width:24px; height:24px; stroke-width:1.8;}
  .cart-badge{
    position:absolute; top:-4px; right:-4px; background:var(--cor-primaria); color:var(--cor-sobre-primaria);
    font-family:var(--font-mono); font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; padding:0 3px;
  }

  /* HERO BANNER (dinâmico via tabela hero_banners) */
  .hero-carousel{display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; padding:16px 20px 0;}
  .hero-carousel::-webkit-scrollbar{display:none;}
  .hero-carousel img{
    scroll-snap-align:start; flex-shrink:0; width:100%; max-width:520px; aspect-ratio:16/7;
    object-fit:cover; border-radius:var(--raio-card); background:var(--cor-card);
  }

  /* CHIPS DE CATEGORIA (dinâmico via tabela categories) */
  .chips-row{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; padding:18px 20px 4px;}
  .chips-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; font-family:var(--font-mono); font-size:12px; padding:8px 14px; border-radius:999px;
    background:var(--cor-card); border:1px solid var(--cor-linha); color:var(--cor-texto-fraco); cursor:pointer; white-space:nowrap;
  }
  .chip.active{background:var(--cor-primaria); color:var(--cor-sobre-primaria); border-color:var(--cor-primaria);}

  /* STRIP DE TIMES (dinâmico via tabela teams — logos vêm de imagem_url/escudo_url) */
  .times-strip{display:flex; gap:14px; overflow-x:auto; scrollbar-width:none; padding:10px 20px 4px;}
  .times-strip::-webkit-scrollbar{display:none;}
  .time-badge{flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; width:60px;}
  .time-badge .escudo{
    width:52px; height:52px; border-radius:50%; background:var(--cor-card); border:1px solid var(--cor-linha);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  .time-badge.active .escudo{border-color:var(--cor-primaria); box-shadow:0 0 0 2px var(--cor-primaria) inset;}
  .time-badge img{width:100%; height:100%; object-fit:contain;}
  .time-badge span{font-size:10px; color:var(--cor-texto-fraco); text-align:center; line-height:1.2;}

  /* GRID DE PRODUTOS */
  .section-title{font-size:22px; padding:24px 0 14px; color:var(--cor-primaria); display:flex; align-items:center; justify-content:space-between;}
  .section-title .limpar{font-family:var(--font-mono); font-size:11px; color:var(--cor-texto-fraco); text-transform:none; letter-spacing:0; cursor:pointer;}
  .grid-produtos{display:grid; grid-template-columns:repeat(2, 1fr); gap:14px;}
  .product-card{
    background:var(--cor-card); border:1px solid var(--cor-linha); border-radius:var(--raio-card);
    overflow:hidden; cursor:pointer;
  }
  .product-card img{width:100%; aspect-ratio:3/4; object-fit:cover; display:block; background:var(--cor-fundo-2);}
  .product-card .info{padding:10px 12px 14px;}
  .product-card .nome{font-size:13px; font-weight:600; line-height:1.3;}
  .product-card .preco{font-family:var(--font-mono); font-size:13px; color:var(--cor-primaria); margin-top:6px;}
  .empty-state{padding:60px 20px; text-align:center; color:var(--cor-texto-fraco); font-size:13.5px;}

  /* CARRINHO */
  .cart-overlay{
    position:fixed; inset:0; background:var(--cor-fundo); z-index:50; transform:translateX(100%);
    transition:transform .25s ease; display:flex; flex-direction:column; overflow-y:auto;
  }
  .cart-overlay.open{transform:translateX(0);}
  .cart-header{display:flex; align-items:center; justify-content:space-between; padding:20px; border-bottom:1px solid var(--cor-linha);}
  .cart-item{display:flex; gap:12px; padding:14px 20px; border-bottom:1px solid var(--cor-linha); align-items:center;}
  .cart-item img{width:56px; height:72px; object-fit:cover; border-radius:8px;}
  .cart-footer{padding:16px 20px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--cor-linha);}
  .btn-primario{
    width:100%; background:var(--cor-primaria); color:var(--cor-sobre-primaria); border:none; border-radius:var(--raio-botao);
    padding:14px; font-family:var(--font-body); font-weight:600; font-size:14px; cursor:pointer;
  }

  .admin-link{
    display:block; text-align:center; padding:24px 20px; font-family:var(--font-mono); font-size:11px;
    color:var(--cor-texto-fraco); text-decoration:none;
  }
  .theme-switch{
    position:fixed; bottom:12px; left:12px; z-index:60; display:flex; gap:6px;
    background:var(--cor-fundo-2); border:1px solid var(--cor-linha); border-radius:20px; padding:6px;
  }
  .theme-switch button{border:none; border-radius:14px; padding:6px 10px; font-family:var(--font-mono); font-size:10px; background:transparent; color:var(--cor-texto-fraco); cursor:pointer;}
  .theme-switch button.active{background:var(--cor-primaria); color:var(--cor-sobre-primaria);}
</style>
</head>
<body>

<div class="topbar">
  <button class="icon-btn" onclick="alert('Abrir menu — implemente seu drawer aqui')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round"/></svg>
  </button>
  <div class="logo" id="nomeLoja"></div>
  <button class="icon-btn" onclick="showCart()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 6h15l-1.5 9h-12z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
    <span class="cart-badge" id="cartBadge">0</span>
  </button>
</div>

<div class="hero-carousel" id="heroCarousel"></div>

<div class="chips-row" id="chipsCategorias"></div>

<div class="times-strip" id="timesStrip"></div>

<div class="wrap">
  <h2 class="section-title">
    <span id="tituloSecao">Produtos</span>
    <span class="limpar" id="btnLimparFiltro" style="display:none;" onclick="limparFiltros()">limpar filtro ✕</span>
  </h2>
  <div class="grid-produtos" id="gridProdutos">
    <div class="empty-state">Carregando produtos…</div>
  </div>
</div>

<div class="cart-overlay" id="cartOverlay">
  <div class="cart-header">
    <h2>Meu Pedido</h2>
    <button class="icon-btn" onclick="closeCart()">✕</button>
  </div>
  <div id="cartBody" style="flex:1;"></div>
  <div class="cart-footer">
    <button class="btn-primario" onclick="finalizarPedidoWhatsApp()">Finalizar no WhatsApp</button>
  </div>
</div>

<a class="admin-link" href="/admin" target="_blank">painel administrativo →</a>

<div class="theme-switch">
  <button onclick="setTheme('dark-esportivo')" id="btnThemeDark">Dark</button>
  <button onclick="setTheme('clean-light')" id="btnThemeLight">Light</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  /* ==========================================================
     CONFIG POR CLIENTE — as 4 únicas linhas que trocam por loja.
     Nome da loja fica aqui porque é 1 string de deploy, não
     conteúdo de catálogo — todo o resto (banners, categorias,
     times/logos, produtos, imagens) vem do Supabase.
     ========================================================== */
  const CONFIG = {
    SUPABASE_URL: "https://SEU-PROJETO.supabase.co",
    SUPABASE_ANON_KEY: "SUA_CHAVE_ANON_AQUI",
    WHATSAPP_NUMERO: "5511999999999",
    NOME_DA_LOJA: "Minha Loja"
  };
  document.getElementById('nomeLoja').textContent = CONFIG.NOME_DA_LOJA;

  let supabaseClient = null;
  let supabaseReady = false;
  try {
    supabaseClient = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    supabaseReady = true;
  } catch(e) {
    console.error("Supabase não configurado:", e);
  }

  let order = [];
  let filtroCategoriaId = null;
  let filtroTimeId = null;

  function setTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('btnThemeDark').classList.toggle('active', theme === 'dark-esportivo');
    document.getElementById('btnThemeLight').classList.toggle('active', theme === 'clean-light');
    localStorage.setItem('tema_preview', theme);
  }
  (function initTheme(){
    const salvo = localStorage.getItem('tema_preview');
    setTheme(salvo || 'dark-esportivo');
  })();

  // ===== HERO BANNERS (tabela hero_banners) =====
  async function loadHeroBanners(){
    const track = document.getElementById('heroCarousel');
    if(!supabaseReady) return;
    const { data } = await supabaseClient.from('hero_banners').select('url, ordem').order('ordem', { ascending:true });
    if(!data || !data.length){ track.style.display = 'none'; return; }
    track.innerHTML = data.map(b => `<img src="${b.url}" alt="banner" loading="lazy">`).join('');
  }

  // ===== CATEGORIAS (tabela categories) =====
  async function loadCategorias(){
    const chipsEl = document.getElementById('chipsCategorias');
    if(!supabaseReady) return;
    const { data } = await supabaseClient.from('categories').select('id, nome, ordem').order('ordem', { ascending:true });
    if(!data || !data.length){ chipsEl.style.display = 'none'; return; }
    chipsEl.innerHTML = data.map(c => `<div class="chip" data-cat="${c.id}" onclick="chooseCategoria('${c.id}')">${c.nome}</div>`).join('');
  }
  function chooseCategoria(catId){
    filtroCategoriaId = filtroCategoriaId === catId ? null : catId;
    filtroTimeId = null;
    document.querySelectorAll('#chipsCategorias .chip').forEach(c => c.classList.toggle('active', c.dataset.cat === filtroCategoriaId));
    document.querySelectorAll('#timesStrip .time-badge').forEach(t => t.classList.remove('active'));
    atualizarTituloSecao();
    loadProducts();
  }

  // ===== TIMES / LOGOS (tabela teams — imagem_url ou escudo_url) =====
  async function loadTeams(){
    const stripEl = document.getElementById('timesStrip');
    if(!supabaseReady) return;
    const { data } = await supabaseClient.from('teams').select('id, nome, imagem_url, escudo_url').order('nome', { ascending:true });
    if(!data || !data.length){ stripEl.style.display = 'none'; return; }
    stripEl.innerHTML = data.map(t => {
      const logo = t.imagem_url || t.escudo_url || '';
      return `<div class="time-badge" data-time="${t.id}" onclick="chooseTime('${t.id}')">
        <div class="escudo">${logo ? `<img src="${logo}" alt="${t.nome}">` : ''}</div>
        <span>${t.nome}</span>
      </div>`;
    }).join('');
  }
  function chooseTime(teamId){
    filtroTimeId = filtroTimeId === teamId ? null : teamId;
    filtroCategoriaId = null;
    document.querySelectorAll('#timesStrip .time-badge').forEach(t => t.classList.toggle('active', t.dataset.time === filtroTimeId));
    document.querySelectorAll('#chipsCategorias .chip').forEach(c => c.classList.remove('active'));
    atualizarTituloSecao();
    loadProducts();
  }

  function limparFiltros(){
    filtroCategoriaId = null; filtroTimeId = null;
    document.querySelectorAll('.chip, .time-badge').forEach(el => el.classList.remove('active'));
    atualizarTituloSecao();
    loadProducts();
  }
  function atualizarTituloSecao(){
    document.getElementById('btnLimparFiltro').style.display = (filtroCategoriaId || filtroTimeId) ? 'inline' : 'none';
  }

  // ===== PRODUTOS (tabela products + product_images) =====
  // Schema: products(id, team_id, tipo, titulo, preco, ordem_exibicao, disponivel...)
  //         product_images(product_id, url, ordem)
  //         teams(id, category_id) — usado para filtrar por categoria via join
  async function loadProducts(){
    const grid = document.getElementById('gridProdutos');
    if(!supabaseReady){
      grid.innerHTML = '<div class="empty-state">Configure o Supabase em CONFIG para listar produtos.</div>';
      return;
    }
    let query = supabaseClient
      .from('products')
      .select('id, titulo, preco, team_id, product_images(url, ordem), teams!inner(category_id)')
      .order('ordem_exibicao', { ascending:true })
      .limit(40);

    if(filtroTimeId) query = query.eq('team_id', filtroTimeId);
    if(filtroCategoriaId) query = query.eq('teams.category_id', filtroCategoriaId);

    const { data, error } = await query;
    if(error || !data || !data.length){
      grid.innerHTML = '<div class="empty-state">Nenhum produto encontrado. Cadastre pelo painel administrativo.</div>';
      return;
    }
    grid.innerHTML = data.map(p => {
      const imagens = (p.product_images || []).slice().sort((a,b) => a.ordem - b.ordem);
      const capa = imagens[0]?.url || '';
      const tituloSeguro = (p.titulo||'').replace(/'/g,"\\'");
      return `
      <div class="product-card" onclick="addToCart('${p.id}', '${tituloSeguro}', ${p.preco}, '${capa}')">
        <img src="${capa}" alt="${p.titulo||''}" loading="lazy">
        <div class="info">
          <div class="nome">${p.titulo||''}</div>
          <div class="preco">R$ ${Number(p.preco||0).toFixed(2)}</div>
        </div>
      </div>
    `;}).join('');
  }

  function addToCart(id, nome, preco, imagem){
    order.push({ id, nome, preco, imagem });
    renderCartBadge();
  }
  function renderCartBadge(){ document.getElementById('cartBadge').textContent = order.length; }
  function renderCartBody(){
    const body = document.getElementById('cartBody');
    if(!order.length){ body.innerHTML = '<div class="empty-state">Seu carrinho está vazio.</div>'; return; }
    body.innerHTML = order.map((it,i) => `
      <div class="cart-item">
        <img src="${it.imagem}" alt="${it.nome}">
        <div style="flex:1;">
          <div>${it.nome}</div>
          <div class="preco" style="color:var(--cor-primaria)">R$ ${it.preco.toFixed(2)}</div>
        </div>
        <button class="icon-btn" onclick="removeFromCart(${i})">✕</button>
      </div>
    `).join('');
  }
  function removeFromCart(i){ order.splice(i,1); renderCartBadge(); renderCartBody(); }
  function showCart(){ renderCartBody(); document.getElementById('cartOverlay').classList.add('open'); }
  function closeCart(){ document.getElementById('cartOverlay').classList.remove('open'); }

  function finalizarPedidoWhatsApp(){
    if(!order.length){ alert('Adicione produtos antes de finalizar.'); return; }
    const linhas = order.map(it => `• ${it.nome} — R$ ${it.preco.toFixed(2)}`).join('%0A');
    const total = order.reduce((s,it) => s + it.preco, 0).toFixed(2);
    const msg = `Olá! Quero fazer um pedido na ${CONFIG.NOME_DA_LOJA}:%0A%0A${linhas}%0A%0ATotal: R$ ${total}`;
    window.open(`https://wa.me/${CONFIG.WHATSAPP_NUMERO}?text=${msg}`, '_blank');
  }

  (async function init(){
    await Promise.all([loadHeroBanners(), loadCategorias(), loadTeams()]);
    await loadProducts();
  })();
</script>

</body>
</html>
